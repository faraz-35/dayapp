name: Windows build

# Builds the Windows NSIS installer on every push to main and refreshes a
# rolling `windows-dev` prerelease — the distribution surface for testers
# (public repo, no login needed to download). A version release doesn't ride
# this workflow: release.yml builds its own installer and puts it on the
# versioned release in the same run.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  nsis:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build NSIS installer
        run: |
          npm ci
          npm run tauri build -- --config src-tauri/tauri.windows.conf.json

      - name: Refresh the rolling windows-dev prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete windows-dev --yes --cleanup-tag || true
          gh release create windows-dev --prerelease \
            --title "DayApp — Windows dev build" \
            --notes "Rolling test build of \`main\`. WebView2 (the runtime) is preinstalled on Windows 10/11. Run the DayApp_*-setup.exe — it installs per-user, no admin needed." \
            src-tauri/target/release/bundle/nsis/*-setup.exe
